name: Deploy to GitHub Pages

on:
  # `main`ブランチにプッシュするたびにワークフローを実行します。
  # 異なるブランチ名を使用する場合は、`main`をブランチ名に置き換えてください。
  push:
    branches: [ main ]
  # このワークフローをGitHubのActionsタブから手動で実行できるようにします。
  workflow_dispatch:

# このジョブがリポジトリをクローンし、ページデプロイメントを作成することを許可します。
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository using git
        uses: actions/checkout@v4
      - name: Sanitize draw.io SVG files
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          for path in Path(".").rglob("*.drawio.svg"):
              text = path.read_text(encoding="utf-8")
              cleaned, count = re.subn(
                  r'\s+content="&lt;mxfile&gt;.*?&lt;/mxfile&gt;"',
                  "",
                  text,
                  count=1,
                  flags=re.DOTALL,
              )
              if count:
                  path.write_text(cleaned, encoding="utf-8")
                  print(f"Sanitized: {path}")
              else:
                  print(f"No embedded draw.io metadata: {path}")
          PY
      - name: Install, build, and upload your site
        uses: withastro/action@v3
        with:
          # path: . # リポジトリ内のAstroプロジェクトのルートロケーション。（オプション）
          # node-version: 20 # サイト構築に使用するNodeのバージョン。デフォルトは20です。（オプション）
          package-manager: npm@latest # ロックファイルが無い場合は明示指定が必要

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
